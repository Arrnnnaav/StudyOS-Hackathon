AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  StudyOS — "Ship It" backing store + one extra AWS service (S3 for Point & Ask crops).
  Provisions the DynamoDB tables the Next.js app (apps/web route handlers) reads/writes,
  the Cognito user pool for identity, an S3 bucket for Point & Ask region crops, Bedrock
  invoke permission, and CloudWatch visibility.
  The web app is deployed separately via App Runner; set its runtime env vars from this stack's outputs.

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-haiku-20241022-v1:0
    Description: Grounded-answer model for Point & Ask. Must be enabled in the account/region.
  Environment:
    Type: String
    Default: hackathon
  EcrRepositoryName:
    Type: String
    Default: learninghq
    Description: Name of the private ECR repository created for the production image.
  GitHubRepository:
    Type: String
    Default: Arrnnnaav@157985495/StudyOS-Hackathon@1375449954
    Description: GitHub owner/repository allowed to deploy the main branch through OIDC.

Resources:
  # ---------------- Identity: Cognito ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub studyos-users-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
      Schema:
        - Name: name
          Required: true
      UserPoolTags: { stack: studyos, environment: !Ref Environment }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: studyos-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # ---------------- State: DynamoDB (pay per request; hackathon scale) ----------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  ProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  AsksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  ExtensionTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  PairingCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  # Durable idempotency results and per-user daily Ask counters. Separate from
  # learning data so expiry can safely clean up request-safety state.
  AskSafetyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Organizations, one-active-membership pointers, invitation links, rotating
  # join codes, and organization-published topics.
  OrganizationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------------- One honest extra AWS service: S3 for Point & Ask crops ----------------
  CropBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub studyos-crops-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["https://*.amplifyapp.com", "http://localhost:3000", "chrome-extension://*"]
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ["content-type", "authorization", "x-device-id"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: purge-old-crops
            Status: Enabled
            ExpirationInDays: 7

  # ---------------- AI: Bedrock invoke permission ----------------
  BedrockPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:Converse]
            Resource: "*"
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub "${CropBucket.Arn}/*"
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem, dynamodb:TransactWriteItems]
            Resource:
              - !GetAtt UsersTable.Arn
              - !GetAtt ProgressTable.Arn
              - !GetAtt AsksTable.Arn
              - !GetAtt ReviewsTable.Arn
              - !GetAtt EventsTable.Arn
              - !GetAtt ExtensionTokensTable.Arn
              - !GetAtt PairingCodesTable.Arn
              - !GetAtt AskSafetyTable.Arn
              - !GetAtt OrganizationsTable.Arn
              - !Sub "${UsersTable.Arn}/index/GSI1"
              - !Sub "${AsksTable.Arn}/index/GSI1"
              - !Sub "${ReviewsTable.Arn}/index/GSI1"

  # Kept for teams that deliberately choose an Amplify-supported Next.js version.
  # It gives SSR handlers short-lived credentials rather than static access keys.
  AmplifySsrComputeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub studyos-amplify-compute-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BedrockPolicy

  # The production hosting target for this Next.js 16 app. Attach this as the
  # App Runner instance role. The running process receives temporary AWS
  # credentials for Bedrock, DynamoDB, and S3 from the SDK credential chain.
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub studyos-apprunner-instance-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BedrockPolicy

  # ---------------- ECS Express and GitHub Actions delivery ----------------
  EcsServiceLinkedRole:
    Type: AWS::IAM::ServiceLinkedRole
    Properties:
      AWSServiceName: ecs.amazonaws.com

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub studyos-ecs-execution-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadRuntimeSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeConfigSecret

  EcsTaskApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub studyos-ecs-task-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BedrockPolicy

  EcsExpressInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub studyos-ecs-infrastructure-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices

  RuntimeConfigSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub learninghq-${Environment}-runtime
      Description: Runtime configuration for LearningHQ ECS tasks. Replace the bootstrap value with the required JSON keys before deployment.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: bootstrap
        PasswordLength: 32
        ExcludePunctuation: true

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub studyos-github-deploy-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: PushLearningHqImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:BatchGetImage, ecr:CompleteLayerUpload, ecr:InitiateLayerUpload, ecr:PutImage, ecr:UploadLayerPart]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
        - PolicyName: DeployLearningHqEcsService
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:CreateCluster, ecs:RegisterTaskDefinition, ecs:CreateExpressGatewayService, ecs:UpdateExpressGatewayService, ecs:DescribeExpressGatewayService, ecs:DescribeClusters, ecs:DescribeServices, ecs:ListServiceDeployments, ecs:DescribeServiceDeployments, ecs:TagResource, ecs:UntagResource]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt EcsTaskExecutionRole.Arn
                  - !GetAtt EcsTaskApplicationRole.Arn
                  - !GetAtt EcsExpressInfrastructureRole.Arn

  # ---------------- Observability: CloudWatch ----------------
  StudyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /studyos/${Environment}
      RetentionInDays: 7

Outputs:
  AmplifySsrComputeRoleArn:
    Description: Attach this role as the Amplify Hosting SSR Compute role.
    Value: !GetAtt AmplifySsrComputeRole.Arn
  AppRunnerInstanceRoleArn:
    Description: Attach this role as the App Runner service's instance role.
    Value: !GetAtt AppRunnerInstanceRole.Arn
  EcsTaskExecutionRoleArn:
    Value: !GetAtt EcsTaskExecutionRole.Arn
  EcsTaskRoleArn:
    Value: !GetAtt EcsTaskApplicationRole.Arn
  EcsInfrastructureRoleArn:
    Value: !GetAtt EcsExpressInfrastructureRole.Arn
  GitHubActionsDeployRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
  RuntimeSecretArn:
    Value: !Ref RuntimeConfigSecret
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  Region: { Value: !Ref AWS::Region }
  BedrockModelId: { Value: !Ref BedrockModelId }
  CropBucketName: { Value: !Ref CropBucket }
  Tables:
    Value: !Join [",", ["StudyOSUsers", "StudyOSProgress", "StudyOSAsks", "StudyOSReviews", "StudyOSEvents", "StudyOSExtensionTokens", "StudyOSPairingCodes", "StudyOSAskSafety", "StudyOSOrganizations"]]
