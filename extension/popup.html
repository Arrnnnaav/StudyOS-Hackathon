<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StudyOS</title>
  <style>
    body { width: 220px; font-family: Inter, system-ui, sans-serif; padding: 14px; background: #0a0a0a; color: #ededed; }
    h2 { font-size: 14px; margin: 0 0 8px; color: #34d399; }
    p { font-size: 12px; line-height: 1.5; margin: 0 0 12px; color: #a3a3a3; }
    button { width: 100%; background: #059669; color: #fff; border: none; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    button:hover { background: #047857; }
  </style>
</head>
<body>
  <h2>StudyOS • Point &amp; Ask</h2>
  <p>Select code or text, then press <strong>Alt+Shift+A</strong> or right-click → <strong>Ask StudyOS</strong>. The side panel opens with your selection.</p>
  <button id="openPanel">Open Side Panel</button>
  <script src="popup.js"></script>
</body>
</html>
