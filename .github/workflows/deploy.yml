name: Validate and deploy LearningHQ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Check types
        run: pnpm exec tsc --noEmit
      - name: Build application
        run: pnpm build

  deploy:
    name: Deploy to ECS Express Mode
    needs: validate
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.ECR_REPOSITORY != '' && vars.ECS_SERVICE != '' && vars.ECS_CLUSTER != '' && vars.ECS_TASK_EXECUTION_ROLE_ARN != '' && vars.ECS_TASK_ROLE_ARN != '' && vars.ECS_INFRASTRUCTURE_ROLE_ARN != '' && vars.RUNTIME_SECRET_ARN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
      ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
      ECS_INFRASTRUCTURE_ROLE_ARN: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
      RUNTIME_SECRET_ARN: ${{ vars.RUNTIME_SECRET_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: OIDC token claims (safe diagnostic)
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch(`${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com`, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          if (!response.ok) throw new Error(`Unable to request OIDC token: ${response.status}`)
          const { value } = await response.json()
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'))
          console.log(`OIDC token claims: aud=${claims.aud}; sub=${claims.sub}`)
          NODE
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: LearningHQGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
      - name: Deploy image
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
          task-role-arn: ${{ vars.ECS_TASK_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 3000
          health-check-path: /api/health
          min-task-count: 1
          max-task-count: 2
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
          environment-variables: |
            [{"name":"NODE_ENV","value":"production"},{"name":"AWS_REGION","value":"${{ vars.AWS_REGION }}"},{"name":"AUTH_TRUST_HOST","value":"true"}]
          secrets: |
            [{"name":"GOOGLE_CLIENT_ID","valueFrom":"${{ vars.RUNTIME_SECRET_ARN }}:GOOGLE_CLIENT_ID::"},{"name":"GOOGLE_CLIENT_SECRET","valueFrom":"${{ vars.RUNTIME_SECRET_ARN }}:GOOGLE_CLIENT_SECRET::"},{"name":"NEXTAUTH_SECRET","valueFrom":"${{ vars.RUNTIME_SECRET_ARN }}:NEXTAUTH_SECRET::"},{"name":"NEXTAUTH_URL","valueFrom":"${{ vars.RUNTIME_SECRET_ARN }}:NEXTAUTH_URL::"},{"name":"NVIDIA_NIM_API_KEY","valueFrom":"${{ vars.RUNTIME_SECRET_ARN }}:NVIDIA_NIM_API_KEY::"},{"name":"MASTER_ADMIN_EMAIL","valueFrom":"${{ vars.RUNTIME_SECRET_ARN }}:MASTER_ADMIN_EMAIL::"}]
